[package]
name = "lispm-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded background execution core for LispM"

# std passes MSG_NOSIGNAL for UnixStream writes on Linux and the BSDs, but Apple
# has no MSG_NOSIGNAL and std does not set SO_NOSIGPIPE: without it a hint write
# to a closed reader raises SIGPIPE, which terminates Emacs.
[target.'cfg(target_vendor = "apple")'.dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }

# The SIGPIPE regression test restores the default disposition in a child process.
[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.191"
