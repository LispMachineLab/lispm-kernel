name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lisp:
    name: SBCL on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install SBCL
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install sbcl; else sudo apt-get update && sudo apt-get install -y sbcl; fi
          sbcl --version
      - name: Test
        run: make test-lisp
      - name: Build
        run: |
          make
          build/lispm-kernel --version

  emacs:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # lispm-agent, whose editor's agents the kernel reads sessions for.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          path: .ci/lispm-agent
      # LispM Kit, whose engine translates the agent's words.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kit
          path: .ci/lispm-kit
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Byte-compile
        run: make compile LISPM_AGENT=.ci/lispm-agent/lisp LISPM_KIT=.ci/lispm-kit
      - name: Test
        run: make test-emacs LISPM_AGENT=.ci/lispm-agent/lisp LISPM_KIT=.ci/lispm-kit
