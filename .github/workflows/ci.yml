name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The LispM Desktop the integration is tested against: its main, which has
  # the frame clock and session readers since LispMachineLab/lispm-desktop#64.
  DESKTOP_REF: main

jobs:
  rust:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Rust the workspace declares, and the newest.
        rust: ['1.95', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  emacs:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # LispM Desktop and the projects it runs, side by side as on a user's
      # computer, so the desktop finds them as ../<repository>.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-desktop
          ref: ${{ env.DESKTOP_REF }}
          path: .ci/lispm-desktop
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-browser
          path: .ci/lispm-browser
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          path: .ci/lispm-agent
      - uses: dtolnay/rust-toolchain@stable
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - run: cargo build --locked -p lispm-kernel-emacs
      - name: Byte-compile
        run: >-
          emacs -Q --batch -L .ci/lispm-desktop/lisp -L lisp
          --eval '(setq byte-compile-error-on-warn t)'
          -f batch-byte-compile lisp/*.el
      - name: Test
        run: python3 scripts/test-emacs.py
        env:
          LISPM_DESKTOP_ROOT: ${{ github.workspace }}/.ci/lispm-desktop

  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p lispm-kernel-emacs
      - run: python3 scripts/package-module.py
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ runner.os }}-${{ runner.arch }}
          path: dist/
