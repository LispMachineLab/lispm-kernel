name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The LispM Desktop the integration is tested against: its main, which has
  # the frame clock and session readers since LispMachineLab/lispm-desktop#64.
  DESKTOP_REF: main

jobs:
  lisp:
    name: SBCL on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install SBCL
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install sbcl; else sudo apt-get update && sudo apt-get install -y sbcl; fi
          sbcl --version
      - name: Test
        run: make test-lisp
      - name: Build
        run: |
          make
          build/lispm-kernel --version

  emacs:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # LispM Desktop and the projects it runs, side by side as on a user's
      # computer, so the desktop finds them as ../<repository>.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-desktop
          ref: ${{ env.DESKTOP_REF }}
          path: .ci/lispm-desktop
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-browser
          path: .ci/lispm-browser
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          path: .ci/lispm-agent
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Byte-compile
        run: make compile LISPM_DESKTOP_ROOT=.ci/lispm-desktop
      - name: Test
        run: make test-emacs LISPM_DESKTOP_ROOT=.ci/lispm-desktop
